name: Deploy React App

on:
  push:
    branches:
      - main  # Deploy when pushing to the main branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: front
        run: npm ci
      - name: Run tests
        working-directory: front
        env:
          CI: true
        run: npx react-scripts test --watchAll=false

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    # Guard the ref here as well as in the trigger: if the trigger is ever
    # widened to run this workflow on a branch, this is what stops a feature
    # branch deploying to production.
    if: github.ref == 'refs/heads/main'

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Copy code to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          # --delete makes the server mirror the repo. Without it a renamed or removed
          # file lingers forever: space-multi's deploy failed compiling a class and its
          # rename side by side. Excluded paths are NOT deleted unless --delete-excluded
          # is passed. Verified before enabling: this deploy path holds only source.
          rsync -avz --delete ./front/ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/front"
          rsync -avz docker-compose.yml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"

      - name: Deploy with Docker Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            set -e
            cd '$VPS_DEPLOY_PATH'
            docker compose build frontend
            docker compose up -d frontend
          "
