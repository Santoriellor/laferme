name: Deploy React App

on:
  push:
    branches:
      - main  # Deploy when pushing to the main branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from front/.nvmrc rather than repeated here, so the
          # version has one home and CI cannot disagree with a local `nvm use`.
          node-version-file: 'front/.nvmrc'
      - name: Install dependencies
        working-directory: front
        run: npm ci
      - name: Check formatting
        working-directory: front
        run: npm run format:check
      - name: Lint
        working-directory: front
        run: npm run lint -- --max-warnings 0
      - name: Run tests
        working-directory: front
        env:
          CI: true
        run: npx react-scripts test --watchAll=false

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    # Guard the ref here as well as in the trigger: if the trigger is ever
    # widened to run this workflow on a branch, this is what stops a feature
    # branch deploying to production.
    if: github.ref == 'refs/heads/main'

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy code to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          # --delete makes the server mirror the repo. Without it a renamed or removed
          # file lingers forever: space-multi's deploy failed compiling a class and its
          # rename side by side. Excluded paths are NOT deleted unless --delete-excluded
          # is passed. Verified before enabling: this deploy path holds only source.
          rsync -avz --delete ./front/ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/front"
          rsync -avz docker-compose.yml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"

      - name: Deploy with Docker Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            set -e
            cd '$VPS_DEPLOY_PATH'
            docker compose build frontend
            docker compose up -d frontend
          "
