server {
    # 8080, not 80: the image is nginxinc/nginx-unprivileged and runs as uid 101,
    # which cannot bind a port below 1024. docker-compose.yml carries the matching
    # traefik ... loadbalancer.server.port=8080 label.
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for any path the filesystem does not have,
    # so client-side routes work on a direct hit or a refresh. Without this, every
    # URL except / returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
