services:
  frontend:
    restart: unless-stopped
    build: ./front
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # HTTPS router
      - "traefik.http.routers.laferme-frontend.rule=Host(`website.santoriello.ch`)"
      - "traefik.http.routers.laferme-frontend.entrypoints=websecure"
      - "traefik.http.routers.laferme-frontend.tls.certresolver=le"

      # security-headers and gzip-compress live in Traefik's file provider
      # (dynamic/middlewares.yml); the @file suffix selects that provider.
      - "traefik.http.routers.laferme-frontend.middlewares=security-headers@file,gzip-compress@file"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
